name: M2M Baseline Validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Verify M2M harness
        run: npm run verify:m2m:harness

      - name: Run full test suite
        run: npm test
