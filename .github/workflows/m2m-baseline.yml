name: M2M Baseline Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check contract registry
        run: npm run contracts:check

      - name: Run contract validation vectors
        run: npm run test:contracts

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Verify M2M harness
        run: npm run verify:m2m:harness

      - name: Run full test suite
        run: npm test

  firestore-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java for Cloud Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Firestore Emulator rules tests
        run: npm run test:firestore:emulator
